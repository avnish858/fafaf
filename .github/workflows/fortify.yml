name: Update Naukri Profile

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight
  workflow_dispatch: # Manual trigger

jobs:
  update-profile:
    runs-on: self-hosted # should use self-hosted runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Naukri profile
        uses: Prateek-Wayne/naukri-resume-action@v1.0.1
        with:
          username: ${{ secrets.NAUKRI_USERNAME }}
          password: ${{ secrets.NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID }}
          resume_path: |-
            ./resumes/Avnish_Dwivedi_FlowCV_Resume_2026-07-02.pdf
          profile_summary: 'Senior DevOps & Cloud Engineer (Remote) | 6+ yrs | AWS, Azure, GCP | Kubernetes (EKS/AKS/GKE), Terraform, CI/CD | GenAI & AI Voice Agent Infra on AWS' # Optional
